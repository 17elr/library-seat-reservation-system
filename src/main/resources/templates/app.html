<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>图书馆座位预约</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="wordmark" href="#home"
        ><span class="brand-mark">图</span>
        <div>图书馆<span class="brand-sub">座位预约管理系统</span></div></a
      >
      <p
        class="nav-caption"
        th:text="${user.role == 'ADMIN' ? '管理工作台' : '学习空间'}"
      ></p>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <p>座位预约服务</p>
        <span>PC 端 · 校园学习空间</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          图书馆 <span>/</span> <b id="breadcrumb">概览</b>
        </div>
        <div class="user-menu">
          <span
            class="role"
            th:text="${user.role == 'ADMIN' ? '管理员' : '学生'}"
          ></span
          ><span th:text="${user.name}"></span>
          <form th:action="@{/logout}" method="post">
            <button class="text-button" type="submit">退出登录</button>
          </form>
        </div>
      </header>
      <main id="content" class="content" aria-live="polite">
        <p class="loading">正在加载工作台…</p>
      </main>
      <footer class="page-footer">
        图书馆座位预约管理系统 <span>请遵守阅览室使用规定</span>
      </footer>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
